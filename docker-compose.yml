services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: extractlayer
      POSTGRES_PASSWORD: extractlayer
      POSTGRES_DB: extractlayer
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractlayer -d extractlayer"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
