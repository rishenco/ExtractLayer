name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: extractlayer
          POSTGRES_PASSWORD: extractlayer
          POSTGRES_DB: extractlayer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extractlayer -d extractlayer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://extractlayer:extractlayer@127.0.0.1:5432/extractlayer

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: scripts/install-workspaces.sh

      - run: make check
